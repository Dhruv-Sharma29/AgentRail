worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 256k;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream agentflow_api {
        zone agentflow_api 64k;
        server backend:8080 resolve;
    }
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_send_timeout 15s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    # React Flow needs inline styles; scripts and network destinations stay same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /actuator/health { proxy_pass http://agentflow_api; }
        location /actuator/ { return 404; }
        location = /api { proxy_pass http://agentflow_api; }
        location /api/ { proxy_pass http://agentflow_api; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
