services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-agentflow}
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/init-local.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
  backend:
    image: agentflow-backend:local
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-agentflow}
      DATABASE_USERNAME: agentflow
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/init-local.py first}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Run python3 scripts/init-local.py first}
      SESSION_COOKIE_SECURE: "false"
      SERVER_SERVLET_SESSION_COOKIE_NAME: AGENTFLOW_SESSION
      AGENTFLOW_PLANNER_PROVIDER: deterministic
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    networks: [web, data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
  frontend:
    image: agentflow-frontend:local
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
networks:
  web:
  data:
    internal: true
volumes:
  postgres-data:
